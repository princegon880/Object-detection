[project]
name = "real-time-webcam-ai"
version = "0.1.0"
description = "Real-time webcam object detection using YOLO and OpenCV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8",
    "ultralytics>=8.3",
    "numpy>=1.26",
]

[project.scripts]
webcam-ai = "webcam_ai.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webcam_ai"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
